# Ezermalas pieteikumu sistēma · iesniegumu API · līgums v0
# Līgumu maina analītiķis. Katra izmaiņa: atsevišķs komits ar pieteikuma ID.

openapi: 3.0.3
info:
  title: Ezermalas pieteikumu sistēma · iesniegumu API
  version: 0.1.0
  description: |
    Iedzīvotāju iesniegumu pieņemšana un apskate.

    Šis līgums ir analītiķa artefakts un patiesības avots (source of truth).
    Ja programma atbild citādi, nekā rakstīts šeit, tā ir kļūda programmā
    vai līgumā, un par to jālemj.

    > Noteikumi vienkāršoti mācību vajadzībām. Ezermalas novada pašvaldība
    > un OMD reģistrs ir izdomāti. Visi dati ir sintētiski.
servers:
  - url: http://localhost:8000
    description: Lokālais prototips (Codespace)
tags:
  - name: Iesniegumi
    description: Iesnieguma pieņemšana un apskate (R1–R3)
  - name: Sistēma
    description: Tehniskie galapunkti (R4)
  - name: Lietotāji
    description: Lietotāju reģistrācija un pieteikšanās (CR-4)
  - name: Organizācijas
    description: Organizāciju izveide, rediģēšana un meklēšana (F1)
  - name: Mijiedarbības
    description: Mijiedarbību žurnāls (F3)
  - name: Pieprasījumi
    description: Pieprasījumi no organizācijām (F4)

paths:
  /health:
    get:
      tags: [Sistēma]
      operationId: getHealth
      summary: Vai serviss darbojas
      responses:
        '200':
          description: Serviss darbojas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /submissions:
    post:
      tags: [Iesniegumi]
      operationId: createSubmission
      summary: Iesniegt iesniegumu
      description: |
        Pieņem iesniegumu, piešķir ID, statusu `RECEIVED`, saņemšanas laiku
        un atbildes termiņu.

        **Atbildes kanāls (CR-2).** Pēc saņemšanas sistēma pārbauda
        iesniedzēja oficiālo e-adresi OMD reģistrā un nosaka `replyChannel`:
        - OMD `ACTIVE` → `E_ADDRESS`, neatkarīgi no `preferredChannel`.
        - OMD `NOT_ACTIVATED` → `preferredChannel`. Ja izvēlēts `E_ADDRESS`,
          bet e-adrese nav aktivizēta: `EMAIL`, un `reasonCode` norāda iemeslu.
        - OMD 404 (reģistrā nav ieraksta) → tāpat kā `NOT_ACTIVATED`.

        *CR-2 daļa nav pabeigta: skatīt `tracker/CR-2.md` un A1.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              personalCode: '32000000001'
              fullName: Līga Ozoliņa-Kalniņa
              email: liga@example.com
              preferredChannel: EMAIL
              topic: ROADS
              subject: Bedre Ezera ielā
              body: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.
      responses:
        '201':
          description: Iesniegums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/ValidationError'

  /submissions/{id}:
    get:
      tags: [Iesniegumi]
      operationId: getSubmission
      summary: Iesniegums pēc ID
      description: Darbinieks atver vienu iesniegumu pēc tā ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Iesnieguma ID
          schema:
            type: string
            example: IES-2026-000123
      responses:
        '200':
          description: Iesniegums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Lietotāji]
      operationId: registerUser
      summary: Reģistrēt lietotāju
      description: |
        Izveido lietotāja kontu (CR-4). `email` tiek saglabāts bez atstarpēm
        sākumā un beigās un mazajiem burtiem. Parole tiek glabāta tikai kā
        jaucējvērtība. Ne e-pasts, ne parole netiek rakstīti žurnālā.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: janis@example.com
              password: drosa-parole-1
      responses:
        '201':
          description: Konts izveidots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/CredentialsValidationError'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '409':
          description: Lietotājs ar šādu e-pastu jau eksistē
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ALREADY_EXISTS
                  message: User already exists
                  details:
                    - field: email
                      issue: ALREADY_EXISTS
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Lietotāji]
      operationId: loginUser
      summary: Pieteikties
      description: |
        Pārbauda e-pastu un paroli (CR-4). Veiksmes gadījumā iestata sesijas
        sīkdatni `session` (`HttpOnly`, `SameSite=Lax`). Nepareizai parolei un
        nezināmam e-pastam atbilde ir vienāda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: janis@example.com
              password: drosa-parole-1
      responses:
        '200':
          description: Pieteikšanās izdevusies
          headers:
            Set-Cookie:
              description: Sesijas sīkdatne, piemēram, `session=…; HttpOnly; Path=/; SameSite=lax`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/CredentialsValidationError'
        '401':
          description: Nepareizs e-pasts vai parole
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Lietotāji]
      operationId: getCurrentUser
      summary: Pieslēgtais lietotājs
      description: Atgriež pieslēgtā lietotāja kontu (F3). Vajadzīga sesija.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pieslēgtais lietotājs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizations:
    get:
      tags: [Organizācijas]
      operationId: listOrganizations
      summary: Meklēt organizācijas
      description: |
        Atgriež organizācijas, sakārtotas pēc nosaukuma latviešu alfabēta
        secībā (F1). `q` meklē daļēju sakritību nosaukumā un reģistrācijas
        numurā; lielie un mazie burti netiek šķirti, garumzīmes tiek ņemtas
        vērā. Vajadzīga sesija.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Meklējamais teksts
          schema:
            type: string
            example: rīga
        - name: mine
          in: query
          required: false
          description: '`true` – tikai organizācijas, kurām pieslēgtais lietotājs ir atbildīgais'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Atrastās organizācijas (var būt tukšs saraksts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Organizācijas]
      operationId: createOrganization
      summary: Izveidot organizāciju
      description: |
        Izveido organizāciju (F1). Ja `responsibleUserId` nav norādīts,
        atbildīgais ir pieslēgtais lietotājs. Vajadzīga sesija.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              name: SIA Ezermalas Ūdens
              regNumber: '40003000001'
              address: Ezera iela 1, Ezermala
      responses:
        '201':
          description: Organizācija izveidota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/OrganizationValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '409':
          $ref: '#/components/responses/RegNumberConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Organizācijas ID
        schema:
          type: integer
          example: 1
    get:
      tags: [Organizācijas]
      operationId: getOrganization
      summary: Organizācija pēc ID
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Organizācija atrasta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Organizācijas]
      operationId: updateOrganization
      summary: Rediģēt organizāciju
      description: |
        Aizstāj visus rediģējamos laukus (F1). Neobligātais lauks, kas nav
        norādīts, tiek notīrīts; izņēmums ir `responsibleUserId`, kas tādā
        gadījumā paliek nemainīts. Vajadzīga sesija.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              name: SIA Ezermalas Ūdens
              regNumber: '40003000001'
              address: Krasta iela 5, Ezermala
              responsibleUserId: 1
      responses:
        '200':
          description: Organizācija atjaunota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/OrganizationValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '409':
          $ref: '#/components/responses/RegNumberConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizations/{id}/interactions:
    parameters:
      - name: id
        in: path
        required: true
        description: Organizācijas ID
        schema:
          type: integer
          example: 1
    get:
      tags: [Mijiedarbības]
      operationId: listOrganizationInteractions
      summary: Organizācijas mijiedarbību hronoloģija
      description: |
        Visas organizācijas mijiedarbības, jaunākās augšā: pēc `occurredOn`,
        tad pēc pievienošanas secības (F3). Vajadzīga sesija.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Hronoloģija (var būt tukšs saraksts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Mijiedarbības]
      operationId: createInteraction
      summary: Pievienot mijiedarbību
      description: |
        Pievieno mijiedarbību organizācijai (F3). Autors ir pieslēgtais
        lietotājs. Vajadzīga sesija.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionInput'
            example:
              occurredOn: '2026-10-14'
              type: CALL
              summary: Pārrunāta sadarbība ūdens kvalitātes projektā.
              nextStep: Nosūtīt līguma projektu līdz piektdienai.
      responses:
        '201':
          description: Mijiedarbība pievienota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/InteractionValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrganizationNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /interactions:
    get:
      tags: [Mijiedarbības]
      operationId: listInteractions
      summary: Mijiedarbību saraksts
      description: |
        Mijiedarbības no visām organizācijām, jaunākās augšā (F3). F9 bloks
        "Pēdējās mijiedarbības" izmanto `mine=true&limit=5`. Vajadzīga sesija.
      security:
        - sessionCookie: []
      parameters:
        - name: mine
          in: query
          required: false
          description: '`true` – tikai pieslēgtā lietotāja ieraksti'
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Lielākais ierakstu skaits
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Mijiedarbības (var būt tukšs saraksts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /interactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Mijiedarbības ID
        schema:
          type: integer
          example: 1
    get:
      tags: [Mijiedarbības]
      operationId: getInteraction
      summary: Mijiedarbība pēc ID
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Mijiedarbība atrasta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Mijiedarbības]
      operationId: updateInteraction
      summary: Labot mijiedarbību
      description: |
        Aizstāj visus laukus (F3). Labot drīkst tikai ieraksta autors.
        Organizācija un autors nemainās. Vajadzīga sesija.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionInput'
            example:
              occurredOn: '2026-10-13'
              type: MEETING
              summary: Tikšanās birojā par ūdens kvalitātes projektu.
              nextStep: null
      responses:
        '200':
          description: Mijiedarbība labota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/InteractionValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotAuthor'
        '404':
          $ref: '#/components/responses/InteractionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests:
    get:
      tags: [Pieprasījumi]
      operationId: listRequests
      summary: Pieprasījumu saraksts ar filtriem
      description: |
        Pieprasījumi, sakārtoti pēc termiņa (agrākais augšā), tad pēc ID (F4).
        Filtri apvienojas ar "un". `overdue` un `overdueDays` tiek aprēķināti
        pēc šodienas Latvijas laikā (Europe/Riga). Vajadzīga sesija.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Viens vai vairāki statusi, piemēram, `status=NEW&status=IN_PROGRESS`
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RequestStatus'
        - name: overdue
          in: query
          required: false
          description: '`true` – tikai kavētie; `false` – tikai nekavētie'
          schema:
            type: boolean
        - name: dueWithinDays
          in: query
          required: false
          description: Neatbildētie ar termiņu līdz šodien + N dienām, ieskaitot kavētos
          schema:
            type: integer
            minimum: 0
            maximum: 365
        - name: mine
          in: query
          required: false
          description: '`true` – tikai organizācijas, kurām pieslēgtais lietotājs ir atbildīgais'
          schema:
            type: boolean
            default: false
        - name: organizationId
          in: query
          required: false
          description: Tikai šīs organizācijas pieprasījumi
          schema:
            type: integer
      responses:
        '200':
          description: Pieprasījumi (var būt tukšs saraksts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Pieprasījumi]
      operationId: createRequest
      summary: Reģistrēt pieprasījumu
      description: |
        Reģistrē organizācijas pieprasījumu (F4). Ja `status` nav norādīts,
        tas ir `NEW`. Vajadzīga sesija.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
            example:
              organizationId: 1
              title: Informācija par ūdens kvalitātes mērījumiem
              description: Lūdz 2026. gada mērījumu rezultātus.
              dueDate: '2026-11-13'
      responses:
        '201':
          description: Pieprasījums reģistrēts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/RequestValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RouteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Pieprasījuma ID
        schema:
          type: integer
          example: 1
    get:
      tags: [Pieprasījumi]
      operationId: getRequest
      summary: Pieprasījums pēc ID
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pieprasījums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/ValidationErrorGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Pieprasījumi]
      operationId: updateRequest
      summary: Labot pieprasījumu un mainīt statusu
      description: |
        Aizstāj `title`, `description`, `dueDate` un `status` (F4). Organizācija
        nemainās. Labot drīkst jebkurš pieslēgts lietotājs. Vajadzīga sesija.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdate'
            example:
              title: Informācija par ūdens kvalitātes mērījumiem
              description: Lūdz 2026. gada mērījumu rezultātus.
              dueDate: '2026-11-13'
              status: IN_PROGRESS
      responses:
        '200':
          description: Pieprasījums labots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/RequestValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RequestNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Sesijas sīkdatne, ko iestata `POST /auth/login` (CR-4)

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0

    SubmissionCreate:
      type: object
      required:
        - personalCode
        - fullName
        - email
        - preferredChannel
        - topic
        - subject
        - body
      properties:
        personalCode:
          type: string
          description: Iesniedzēja personas kods
          example: '32000000001'
        fullName:
          type: string
          description: Iesniedzēja vārds un uzvārds
          example: Jānis Bērziņš
        email:
          type: string
          format: email
          description: Iesniedzēja e-pasts
          example: janis@example.com
        preferredChannel:
          $ref: '#/components/schemas/PreferredChannel'
        topic:
          $ref: '#/components/schemas/Topic'
        subject:
          type: string
          description: Iesnieguma temats
          example: Bedre Ezera ielā
        body:
          type: string
          description: Iesnieguma teksts
          example: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.

    SubmissionCreated:
      type: object
      required: [id, status, receivedAt, dueDate, replyChannel]
      properties:
        id:
          type: string
          description: Iesnieguma ID
          example: IES-2026-000123
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: Saņemšanas laiks
          example: '2026-10-01T09:15:00Z'
        dueDate:
          type: string
          description: Atbildes termiņš
          example: '2026-11-02'
        replyChannel:
          $ref: '#/components/schemas/ReplyChannel'
        reasonCode:
          type: string
          nullable: true
          description: |
            Kāpēc `replyChannel` atšķiras no `preferredChannel`.
            `null`, ja kanāls sakrīt. *CR-2: vērtību saraksts nav pabeigts.*
          example: E_ADDRESS_NOT_ACTIVE

    Submission:
      description: Pilns iesnieguma ieraksts
      allOf:
        - $ref: '#/components/schemas/SubmissionCreated'
        - $ref: '#/components/schemas/SubmissionCreate'

    PreferredChannel:
      type: string
      description: Kā iesniedzējs vēlas saņemt atbildi
      enum: [EMAIL, POST, E_ADDRESS]
      example: EMAIL

    ReplyChannel:
      type: string
      description: |
        Kanāls, pa kuru sūtīs atbildi (nosaka sistēma, CR-2).
        *CR-2: vērtību saraksts nav pabeigts.*
      enum: [EMAIL, POST, E_ADDRESS]
      example: E_ADDRESS

    Topic:
      type: string
      description: |
        Iesnieguma tēma:
        `ROADS` Ceļi un ielas · `WASTE` Atkritumi ·
        `PLANNING` Teritorijas plānošana · `OTHER` Cits
      enum: [ROADS, WASTE, PLANNING, OTHER]
      example: ROADS

    SubmissionStatus:
      type: string
      description: Iesnieguma statuss. Jauns iesniegums vienmēr ir `RECEIVED`.
      enum: [RECEIVED, IN_PROGRESS, FORWARDED, ANSWERED, WITHDRAWN]
      example: RECEIVED

    Credentials:
      type: object
      description: |
        Reģistrācijas un pieteikšanās dati (CR-4). Lauka kļūdas: `REQUIRED`,
        `INVALID_FORMAT`, `TOO_SHORT` (tikai reģistrācijā, parole < 8 rakstzīmes).
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: janis@example.com
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          example: drosa-parole-1

    User:
      type: object
      description: Lietotāja konts. Parole atbildē nekad netiek iekļauta.
      required: [id, email]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: janis@example.com

    OrganizationInput:
      type: object
      description: |
        Organizācijas dati izveidei un rediģēšanai (F1). Lauka kļūdas:
        `REQUIRED`, `INVALID_FORMAT`, `TOO_LONG`, `NOT_FOUND` (nav tāda
        lietotāja), `ALREADY_EXISTS` (ar 409). Tukša virkne neobligātajā laukā
        tiek saglabāta kā `null`.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nosaukums; atstarpes sākumā un beigās tiek noņemtas
          example: SIA Ezermalas Ūdens
        regNumber:
          type: string
          nullable: true
          pattern: '^[0-9]{11}$'
          description: Reģistrācijas numurs, 11 cipari, unikāls
          example: '40003000001'
        address:
          type: string
          nullable: true
          maxLength: 300
          example: Ezera iela 1, Ezermala
        responsibleUserId:
          type: integer
          nullable: true
          description: Atbildīgā darbinieka lietotāja ID
          example: 1

    Organization:
      type: object
      required: [id, name, regNumber, address, responsibleUserId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: SIA Ezermalas Ūdens
        regNumber:
          type: string
          nullable: true
          example: '40003000001'
        address:
          type: string
          nullable: true
          example: Ezera iela 1, Ezermala
        responsibleUserId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2026-10-14T09:15:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-14T09:15:00Z'

    InteractionType:
      type: string
      description: '`CALL` Zvans · `EMAIL` E-pasts · `MEETING` Sanāksme'
      enum: [CALL, EMAIL, MEETING]
      example: CALL

    InteractionInput:
      type: object
      description: |
        Mijiedarbības dati (F3). Lauka kļūdas: `REQUIRED`, `INVALID_FORMAT`,
        `IN_FUTURE` (datums pēc šodienas, Europe/Riga), `TOO_LONG`.
      required: [occurredOn, type, summary]
      properties:
        occurredOn:
          type: string
          format: date
          example: '2026-10-14'
        type:
          $ref: '#/components/schemas/InteractionType'
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          example: Pārrunāta sadarbība ūdens kvalitātes projektā.
        nextStep:
          type: string
          nullable: true
          maxLength: 500
          example: Nosūtīt līguma projektu līdz piektdienai.

    Interaction:
      type: object
      required:
        - id
        - organizationId
        - organizationName
        - authorId
        - occurredOn
        - type
        - summary
        - nextStep
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        organizationId:
          type: integer
          example: 1
        organizationName:
          type: string
          example: SIA Ezermalas Ūdens
        authorId:
          type: integer
          example: 1
        occurredOn:
          type: string
          format: date
          example: '2026-10-14'
        type:
          $ref: '#/components/schemas/InteractionType'
        summary:
          type: string
          example: Pārrunāta sadarbība ūdens kvalitātes projektā.
        nextStep:
          type: string
          nullable: true
          example: Nosūtīt līguma projektu līdz piektdienai.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-14T09:15:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-14T09:15:00.000Z'

    RequestStatus:
      type: string
      description: '`NEW` Jauns · `IN_PROGRESS` Darbā · `ANSWERED` Atbildēts'
      enum: [NEW, IN_PROGRESS, ANSWERED]
      example: NEW

    RequestUpdate:
      type: object
      description: |
        Pieprasījuma dati labošanai (F4). Lauka kļūdas: `REQUIRED`,
        `INVALID_FORMAT`, `TOO_LONG`. Tukša virkne laukā `description` tiek
        saglabāta kā `null`.
      required: [title, dueDate, status]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Informācija par ūdens kvalitātes mērījumiem
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: Lūdz 2026. gada mērījumu rezultātus.
        dueDate:
          type: string
          format: date
          example: '2026-11-13'
        status:
          $ref: '#/components/schemas/RequestStatus'

    RequestCreate:
      type: object
      description: |
        Pieprasījuma dati reģistrēšanai (F4). Papildus `RequestUpdate` kļūdām:
        `organizationId` / `NOT_FOUND`, ja organizācijas nav. `status` nav
        obligāts, noklusējums `NEW`.
      required: [organizationId, title, dueDate]
      properties:
        organizationId:
          type: integer
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Informācija par ūdens kvalitātes mērījumiem
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: Lūdz 2026. gada mērījumu rezultātus.
        dueDate:
          type: string
          format: date
          example: '2026-11-13'
        status:
          $ref: '#/components/schemas/RequestStatus'

    Request:
      type: object
      required:
        - id
        - organizationId
        - organizationName
        - title
        - description
        - dueDate
        - status
        - overdue
        - overdueDays
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        organizationId:
          type: integer
          example: 1
        organizationName:
          type: string
          example: SIA Ezermalas Ūdens
        title:
          type: string
          example: Informācija par ūdens kvalitātes mērījumiem
        description:
          type: string
          nullable: true
          example: Lūdz 2026. gada mērījumu rezultātus.
        dueDate:
          type: string
          format: date
          example: '2026-11-13'
        status:
          $ref: '#/components/schemas/RequestStatus'
        overdue:
          type: boolean
          description: '`status` ≠ `ANSWERED` un `dueDate` < šodien (Europe/Riga)'
          example: false
        overdueDays:
          type: integer
          minimum: 0
          description: Cik dienas kavēts; 0, ja nav kavēts
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-10-14T09:15:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-14T09:15:00.000Z'

    Error:
      type: object
      description: Vienota kļūdu shēma visiem galapunktiem
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kļūdas kods, piemēram, `VALIDATION_ERROR` vai `NOT_FOUND`
              example: VALIDATION_ERROR
            message:
              type: string
              description: Cilvēkam lasāms apraksts. Bez personas datiem.
              example: Request validation failed
            details:
              type: array
              description: Katra lauka kļūda atsevišķi (tikai `VALIDATION_ERROR`)
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    example: personalCode
                  issue:
                    type: string
                    example: INVALID_FORMAT

  responses:
    Unauthorized:
      description: Nav derīgas sesijas. Lietotājam jāpiesakās.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    ValidationErrorGeneric:
      description: Kļūdains pieprasījuma parametrs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: id
                  issue: INVALID_FORMAT
    OrganizationValidationError:
      description: Kļūdaini organizācijas dati. Izmaiņas netiek saglabātas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: name
                  issue: REQUIRED
    OrganizationNotFound:
      description: Organizācija ar šādu ID nav atrasta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Organization not found
    RegNumberConflict:
      description: Reģistrācijas numurs jau pieder citai organizācijai
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ALREADY_EXISTS
              message: Organization already exists
              details:
                - field: regNumber
                  issue: ALREADY_EXISTS
    InteractionValidationError:
      description: Kļūdaini mijiedarbības dati. Izmaiņas netiek saglabātas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: occurredOn
                  issue: IN_FUTURE
    InteractionNotFound:
      description: Mijiedarbība ar šādu ID nav atrasta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Interaction not found
    NotAuthor:
      description: Labot drīkst tikai ieraksta autors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Only the author can edit this interaction
    RequestValidationError:
      description: Kļūdaini pieprasījuma dati. Izmaiņas netiek saglabātas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: dueDate
                  issue: INVALID_FORMAT
    RequestNotFound:
      description: Pieprasījums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Request not found
    ValidationError:
      description: Kļūdains pieprasījums. Iesniegums netiek saglabāts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: personalCode
                  issue: INVALID_FORMAT
    NotFound:
      description: Iesniegums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Submission not found
    CredentialsValidationError:
      description: Kļūdains pieprasījums. Konts netiek izveidots, sesija netiek iestatīta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: password
                  issue: TOO_SHORT
    RouteNotFound:
      description: Galapunkts nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Not found
    InternalError:
      description: Neparedzēta servera kļūda
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected server error
