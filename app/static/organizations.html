<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizācijas</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <nav aria-label="Galvenā navigācija">
    <ul>
      <li class="staff-only"><a href="/organizacijas">Organizācijas</a></li>
      <li class="staff-only"><a href="/pieprasijumi">Pieprasījumi</a></li>
      <li class="admin-only" hidden><a href="/admin">Administrēšana</a></li>
    </ul>
  </nav>
  <p id="who"></p>
  <button type="button" id="logout">Izrakstīties</button>
</header>
<main class="wide">
  <h1>Organizācijas</h1>

  <section aria-labelledby="search-heading">
    <h2 id="search-heading">Meklēt</h2>
    <form id="search" role="search">
      <label for="q">Meklēt pēc nosaukuma vai reģ. nr.</label>
      <input id="q" name="q" type="search">
      <label class="inline"><input id="mine" name="mine" type="checkbox"> Tikai manas</label>
      <button type="submit">Meklēt</button>
    </form>
  </section>

  <section aria-labelledby="list-heading">
    <h2 id="list-heading">Saraksts</h2>
    <div class="table-scroll">
      <table>
        <caption>Organizācijas</caption>
        <thead>
          <tr>
            <th scope="col">Nosaukums</th>
            <th scope="col">Reģ. nr.</th>
            <th scope="col">Adrese</th>
            <th scope="col">Darbība</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" hidden>Nav atrasta neviena organizācija.</p>
  </section>

  <section aria-labelledby="form-heading">
    <h2 id="form-heading">Jauna organizācija</h2>
    <form id="form" novalidate>
      <input type="hidden" id="org-id">

      <label for="name">Nosaukums (obligāts)</label>
      <input id="name" name="name" maxlength="200" required aria-describedby="name-error">
      <div class="field-error" id="name-error"></div>

      <label for="regNumber">Reģistrācijas numurs (11 cipari)</label>
      <input id="regNumber" name="regNumber" inputmode="numeric" aria-describedby="regNumber-error">
      <div class="field-error" id="regNumber-error"></div>

      <label for="address">Adrese</label>
      <input id="address" name="address" maxlength="300" aria-describedby="address-error">
      <div class="field-error" id="address-error"></div>

      <div id="responsible-field" hidden>
        <label for="responsibleUserId">Atbildīgais darbinieks</label>
        <select id="responsibleUserId" aria-describedby="responsibleUserId-error"></select>
        <div class="field-error" id="responsibleUserId-error"></div>
      </div>

      <button type="submit" id="save">Saglabāt</button>
      <button type="button" id="cancel" hidden>Atcelt rediģēšanu</button>
    </form>
  </section>

  <p id="message" role="status"></p>
</main>
<script src="/static/nav.js"></script>
<script src="/static/organizations.js"></script>
</body>
</html>
